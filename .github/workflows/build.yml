name: Builds Android et Windows

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORGE_DIR: ${{ github.workspace }}/../forge-src
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Version 0.2.x : le build 13 est la 0.2.0, chaque build suivant ajoute 1 au dernier chiffre.
      - name: Version
        id: version
        run: |
          VERSION="0.2.$(( ${{ github.run_number }} - 13 ))"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compiler Forge (règles, IA, cartes)
        run: scripts/build-forge.sh "$FORGE_DIR"

      - name: Compiler le pont
        run: mvn -B -q install -DskipTests

      - name: Préparer les ressources et l'interface
        run: |
          scripts/package-res.sh "$FORGE_DIR/forge-gui/res" "$RUNNER_TEMP/forge-assets" android/app/src/main/assets/res.zip
          rm -rf android/app/src/main/assets/ui
          cp -r ui android/app/src/main/assets/ui

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Construire l'APK
        working-directory: android
        run: gradle --no-daemon assembleRelease -PversionCode=${{ github.run_number }} -PversionName=$VERSION

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "ArcaneTable-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ArcaneTable-apk
          path: ArcaneTable-*.apk

      # Version iPhone (PWA) : le même code, publié sur GitHub Pages ; Forge y tourne dans Safari grâce à CheerpJ.
      - name: Préparer la version iPhone (PWA)
        run: scripts/package-pwa.sh "$RUNNER_TEMP/forge-assets" web/target "$VERSION" "$RUNNER_TEMP/pwa"

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: ${{ runner.temp }}/pwa

      - uses: actions/upload-artifact@v4
        with:
          name: pwa-site
          path: ${{ runner.temp }}/pwa
          retention-days: 3

      - name: Préparer le paquet ordinateur
        run: |
          mkdir -p dist
          cp desktop/target/desktop-0.1.0.jar dist/
          cp -r desktop/target/lib dist/lib
          cp -r "$RUNNER_TEMP/forge-assets" dist/forge
          cp -r ui dist/ui

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-dist
          path: dist

      - name: Publier la dernière version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest ArcaneTable-*.apk \
            --title "Arcane Table $VERSION — dernière version (build ${{ github.run_number }})" \
            --notes "Construit automatiquement depuis le commit ${{ github.sha }}. Android : télécharge le fichier .apk sur le téléphone puis ouvre-le (autorise l'installation depuis cette source si Android le demande). Windows : télécharge le .zip (ajouté quelques minutes après l'APK), décompresse-le dans un dossier de ton choix, puis lance ArcaneTable.exe. iPhone : ouvre https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ dans Safari, puis Partager > Sur l'écran d'accueil." \
            --prerelease

  # Publication de la version iPhone. Une seule fois avant : Settings > Pages > Source « GitHub Actions ».
  pwa:
    needs: apk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: GitHub Pages activé ?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api repos/${{ github.repository }} -q .has_pages)" = "true" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Version iPhone non publiée::GitHub Pages n'est pas activé. Une seule fois : Settings > Pages > Source « GitHub Actions », puis relancer ce build."
            echo "on=false" >> "$GITHUB_OUTPUT"
          fi

      - id: deploy
        if: steps.pages.outputs.on == 'true'
        uses: actions/deploy-pages@v4

  # Essai de la version iPhone dans Chromium et WebKit (le moteur de Safari) : démarrage de Forge dans la page,
  # une partie, un second lancement. Rapport et captures sur la branche pwa-test-results.
  pwa-test:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pwa-site
          path: site

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Navigateurs
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit

      - name: Essayer la version iPhone
        run: node scripts/pwa-test.mjs site pwa-test chromium,webkit

      - name: Publier le rapport (branche pwa-test-results)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d pwa-test ] || exit 0
          cd pwa-test
          git init -q -b pwa-test-results
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Essai de la version iPhone (${{ github.sha }})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" pwa-test-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-test
          path: pwa-test

  windows:
    needs: apk
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Avant le téléchargement : la récupération du dépôt vide le dossier de travail.
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@v4
        with:
          name: desktop-dist
          path: dist

      - name: Moteur (Forge et Java inclus)
        shell: pwsh
        run: |
          jpackage --type app-image --input dist --main-jar desktop-0.1.0.jar --main-class atclaude.desktop.DesktopMain `
            --name ArcaneTableMoteur --app-version ${{ needs.apk.outputs.version }} --vendor "Arcane Table" `
            --icon windows/ArcaneTable.ico --java-options "-Xmx2g" --dest out

      - name: Fenêtre de l'application (WebView2)
        shell: pwsh
        run: dotnet build windows/ArcaneTable.csproj -c Release -o out/fenetre -p:Version=${{ needs.apk.outputs.version }}

      - name: Assembler le paquet
        shell: pwsh
        run: |
          # ArcaneTable.exe (la fenêtre) à la racine, le moteur dans moteur/.
          New-Item -ItemType Directory -Force -Path pack/ArcaneTable | Out-Null
          Get-ChildItem out/fenetre -Exclude *.pdb | Copy-Item -Destination pack/ArcaneTable -Recurse
          Copy-Item out/fenetre/runtimes/win-x64/native/WebView2Loader.dll pack/ArcaneTable/
          Move-Item out/ArcaneTableMoteur pack/ArcaneTable/moteur
          if (-not (Test-Path pack/ArcaneTable/moteur/ArcaneTableMoteur.exe)) { throw "moteur absent du paquet" }
          Compress-Archive -Path pack/ArcaneTable -DestinationPath ArcaneTable-Windows-${{ needs.apk.outputs.version }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ArcaneTable-windows
          path: ArcaneTable-Windows-*.zip

      - name: Ajouter à la dernière version
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload apk-latest (Get-ChildItem ArcaneTable-Windows-*.zip).FullName --clobber --repo ${{ github.repository }}
