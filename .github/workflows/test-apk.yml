name: APK de test (AT TEST)

# Version de test : chaque envoi sur la branche « test » construit l'APK « AT TEST », publiée à part (release
# « apk-test »). Elle a son propre identifiant Android (elle s'installe à côté d'Arcane Table, avec ses propres
# données) et sa propre synchronisation GitHub : l'appli publiée et la release « apk-latest » ne bougent pas.

on:
  push:
    branches: [test]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORGE_DIR: ${{ github.workspace }}/../forge-src
    steps:
      - uses: actions/checkout@v4

      # La version en préparation (celle de la prochaine publication, à changer avec build.yml), puis le numéro du build de test.
      - name: Version
        run: |
          VERSION="0.7.4-test.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version $VERSION"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compiler Forge (règles, IA, cartes)
        run: scripts/build-forge.sh "$FORGE_DIR"

      - name: Compiler le pont
        run: mvn -B -q install -DskipTests

      # Chaque effet, déclencheur, mot-clé et sorte de carte de l'Atelier : le script généré doit être accepté par le
      # vrai moteur (l'hôte ordinateur, démarré ici sans fenêtre). Un seul refus arrête le build de test.
      - name: Tests de l'Atelier par Forge
        run: |
          mkdir -p "$RUNNER_TEMP/at-data"
          java -Xmx3g -jar "$(ls desktop/target/desktop-*.jar | head -1)" --assets "$FORGE_DIR/forge-gui" \
            --data "$RUNNER_TEMP/at-data" --ui ui --no-browser > "$RUNNER_TEMP/host.log" 2>&1 &
          HOST=$!
          for i in $(seq 1 240); do grep -q "Forge pr" "$RUNNER_TEMP/host.log" && break; sleep 2; done
          grep -q "Forge pr" "$RUNNER_TEMP/host.log" || { tail -60 "$RUNNER_TEMP/host.log"; exit 1; }
          node tests/atelier-forge.mjs
          kill $HOST || true

      - name: Préparer les ressources et l'interface
        run: |
          scripts/package-res.sh "$FORGE_DIR/forge-gui/res" "$RUNNER_TEMP/forge-assets" android/app/src/main/assets/res.zip
          rm -rf android/app/src/main/assets/ui
          cp -r ui android/app/src/main/assets/ui

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Construire l'APK AT TEST
        working-directory: android
        run: gradle --no-daemon assembleRelease -PversionCode=${{ github.run_number }} -PversionName=$VERSION -PappIdSuffix=.test "-PappLabel=AT TEST"

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "AT-TEST-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AT-TEST-apk
          path: AT-TEST-*.apk

      - name: Publier la version de test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-test --yes --cleanup-tag || true
          {
            echo "Version de test construite depuis la branche test (commit ${{ github.sha }}), pour essayer les nouveautés avant de les publier. Elle s'installe à côté d'Arcane Table (appli « AT TEST », données à part). Sa synchronisation GitHub a son propre Gist : à la première synchronisation, elle part d'une copie du compte d'Arcane Table, sans jamais le modifier."
            echo
            echo "Nouveautés à essayer :"
            echo
            awk '/^## /{n++} n==1' PATCH-NOTES.md
          } > release-notes.md
          gh release create apk-test AT-TEST-*.apk --target "${{ github.sha }}" \
            --title "AT TEST — version de test $VERSION (build ${{ github.run_number }})" \
            --notes-file release-notes.md \
            --prerelease
