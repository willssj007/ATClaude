name: APK Android

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORGE_DIR: ${{ github.workspace }}/../forge-src
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compiler Forge (règles, IA, cartes)
        run: scripts/build-forge.sh "$FORGE_DIR"

      - name: Compiler le pont
        run: mvn -B -q install -DskipTests

      - name: Préparer les ressources et l'interface
        run: |
          scripts/package-res.sh "$FORGE_DIR/forge-gui/res" "$RUNNER_TEMP/forge-assets" android/app/src/main/assets/res.zip
          rm -rf android/app/src/main/assets/ui
          cp -r ui android/app/src/main/assets/ui

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Construire l'APK
        working-directory: android
        run: gradle --no-daemon assembleRelease -PversionCode=${{ github.run_number }} -PversionName=0.1.${{ github.run_number }}

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "ArcaneTable-0.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ArcaneTable-apk
          path: ArcaneTable-*.apk

      - name: Publier la dernière version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest ArcaneTable-*.apk \
            --title "Arcane Table — dernière version Android (build ${{ github.run_number }})" \
            --notes "APK construit automatiquement depuis le commit ${{ github.sha }}. Sur le téléphone : télécharge le fichier .apk puis ouvre-le (autorise l'installation depuis cette source si Android le demande)." \
            --prerelease
