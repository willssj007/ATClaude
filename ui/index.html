<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d0f1a">
  <title>Arcane Table</title>
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/career.css">
  <link rel="stylesheet" href="css/packopen.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><img src="img/icon.svg" alt=""><span>Arcane Table</span></div>
      <nav id="nav">
        <button data-screen="home" class="active">Accueil</button>
        <button data-screen="lobby" data-mode-only="sandbox">Jouer</button>
        <button data-screen="duel" data-mode-only="planeswalker">Duel</button>
        <button data-screen="decks">Decks</button>
        <button data-screen="cards">Cartes</button>
        <button data-screen="boosters" data-mode-only="planeswalker">Boutique</button>
        <button data-screen="stats">Stats</button>
        <button data-screen="trophies">Trophées</button>
        <button data-screen="settings">Réglages</button>
      </nav>
      <button id="mana-chip" class="mana-chip hidden" title="Ton mana (mode Planeswalker) : ouvre la boutique de boosters"></button>
      <button id="profile-btn" class="profile-btn" data-screen="account" title="Mon compte"></button>
      <button id="resume-game" class="btn gold hidden">Reprendre la partie</button>
    </header>

    <main id="screens">
      <section id="screen-home" class="screen active"></section>
      <section id="screen-lobby" class="screen"></section>
      <section id="screen-duel" class="screen"></section>
      <section id="screen-boosters" class="screen"></section>
      <section id="screen-decks" class="screen"></section>
      <section id="screen-cards" class="screen"></section>
      <section id="screen-settings" class="screen"></section>
      <section id="screen-trophies" class="screen"></section>
      <section id="screen-stats" class="screen"></section>
      <section id="screen-account" class="screen"></section>
      <section id="screen-game" class="screen"></section>
      <section id="screen-replay" class="screen"></section>
    </main>
  </div>

  <div id="loading" class="overlay">
    <div class="loading-box">
      <img src="img/icon.svg" alt="" class="loading-logo">
      <h1>Arcane Table</h1>
      <p id="loading-text">Connexion au moteur…</p>
      <div class="progress"><div id="loading-bar"></div></div>
      <p class="muted small">Moteur de règles Forge · toutes les cartes de Magic, en français</p>
    </div>
  </div>

  <div id="dialogs"></div>
  <div id="toasts"></div>
  <div id="zoom" class="hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
